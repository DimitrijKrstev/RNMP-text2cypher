[project]
name = "text2cypher"
version = "0.1.0"
description = "A comparison of text2cypher and text2sql models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.0",
    "duckdb>=1.3.2",
    "neo4j>=5.28.2",
    "openai>=1.107.1",
    "relbench>=1.1.0",
    "sqlparse>=0.5.3",
    "tqdm>=4.67.1",
    "transformers>=4.55.2",
    "bitsandbytes>=0.47.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "typer==0.19.2",
    "python-dotenv>=1.1.1",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "sqlglot>=28.0.0",
    "antlr4-python3-runtime>=4.13.2",
    "antlr4-cypher>=0.1.2",
    "litellm>=1.80.7",
    "graphlib>=0.9.5",
]
[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    "TID",  # Some good import practices
    "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    "NPY",  # Some numpy-specific things
    "A",    # detect shadowed builtins
    "N",    # enforce naming conventions, e.g. ClassName vs function_name
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["text2cypher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]
